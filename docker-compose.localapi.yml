# Дополнительный оверлей: свой Telegram Bot API server -> файлы до 2 ГБ.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.localapi.yml up -d --build
# Нужны TELEGRAM_API_ID и TELEGRAM_API_HASH с https://my.telegram.org
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    depends_on:
      - telegram-bot-api
    environment:
      LOCAL_BOT_API: http://telegram-bot-api:8081
      MAX_UPLOAD_MB: 1900

volumes:
  tg-api-data:
